services:
  - type: web
    name: healerai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --production
    startCommand: node server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        value: AIzaSyC1FbrqKHMkS18alFf0JvSXImNdDWkyGMs
      - key: GOOGLE_MAPS_API_KEY
        sync: false   # set this manually in the Render dashboard
    healthCheckPath: /health
    autoDeploy: true
